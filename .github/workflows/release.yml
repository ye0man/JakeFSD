name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0-m1)'
        required: true
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: true
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - name: Create or reuse release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.payload.inputs.version;
            const draft = context.payload.inputs.draft === 'true';
            const prerelease = context.payload.inputs.prerelease === 'true';

            try {
              const { data: existing } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag,
              });
              console.log(`Reusing existing release ${existing.id}`);
              return existing.id;
            } catch (err) {
              if (err.status !== 404) throw err;
            }

            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `JakeFSD ${tag}`,
              body: [
                'Installers for Windows, macOS, and Linux are attached below.',
                '',
                '**Note:** The desktop app requires Python 3.11+ and the `jakefsd` package installed',
                'on your system. After installing the app, run:',
                '',
                '```bash',
                'pip install "git+https://github.com/ye0man/JakeFSD.git#subdirectory=python"',
                '```',
              ].join('\n'),
              draft: draft,
              prerelease: prerelease,
            });
            console.log(`Created release ${release.id}`);
            return release.id;

  test-python:
    name: Test Python backend
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python package and test dependencies
        working-directory: ./python
        run: pip install -e ".[dev]"

      - name: Run Python tests
        working-directory: ./python
        run: pytest tests -v

  build-tauri:
    name: Build Tauri app (${{ matrix.platform }})
    needs: [create-release, test-python]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
