[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jakefsd"
version = "0.1.0"
description = "Open-source, local-first IDE for data pipelines"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "ye0man"}
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "toml>=0.10.2",
    "duckdb>=1.0",
    "pandas>=2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0",
    "litellm>=1.0",
    "keyring>=25.0",
    "croniter>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
]

[project.scripts]
jakefsd = "jakefsd.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["jakefsd*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
